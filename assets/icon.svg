<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="Campaign Server Side">
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2c3d"/>
      <stop offset="100%" stop-color="#0b141d"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3346"/>
      <stop offset="100%" stop-color="#101d28"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9b0"/>
      <stop offset="100%" stop-color="#e79a2b"/>
    </linearGradient>
  </defs>

  <!-- slab -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#slab)"/>
  <rect x="10" y="10" width="236" height="236" rx="54" fill="none" stroke="#2b4258" stroke-width="3"/>

  <!-- orbit: dark base circle plus two bright arcs -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#1f2f40" stroke-width="10"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#8ecae6" stroke-width="10"
          stroke-dasharray="200 428" stroke-linecap="butt" transform="rotate(25 128 128)"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#8ecae6" stroke-width="10"
          stroke-dasharray="200 428" stroke-linecap="butt" transform="rotate(205 128 128)"/>

  <!-- sector hexagon -->
  <path d="M128 62 L190 98 L190 158 L128 194 L66 158 L66 98 Z"
        fill="url(#hex)" stroke="#3a5d7d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M128 76 L178 104 L178 152 L128 180 L78 152 L78 104 Z"
        fill="none" stroke="#25405a" stroke-width="4" stroke-linejoin="round"/>

  <!-- core: beveled block, dark inset, bright centre -->
  <rect x="96" y="96" width="64" height="64" rx="11" fill="url(#core)"/>
  <rect x="100" y="100" width="56" height="7" rx="3" fill="#fff5d2" opacity="0.28"/>
  <rect x="106" y="106" width="44" height="44" rx="6" fill="#3a2609" opacity="0.6"/>
  <rect x="117" y="117" width="22" height="22" rx="4" fill="#ffe9b0"/>

  <!-- vote badge -->
  <circle cx="190" cy="186" r="33" fill="#0e3320" stroke="#4ecb72" stroke-width="5"/>
  <path d="M175 186 l10 11 l20 -24" fill="none" stroke="#4ecb72" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
