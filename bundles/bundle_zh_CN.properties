# Campaign Server Side - 简体中文
# 与 bundle.properties 的键一一对应；改文案只需要改这里。

# ---------------------------------------------------------------- 命令列表
campaign.help.header=战役命令：
campaign.help.host=campaign-host [sector]      - 进入战役，从指定区块开始
campaign.help.goto=campaign-goto <sector>      - 切换到另一个区块（先保存当前区块）
campaign.help.reset=campaign-reset <sector>     - 删除该区块存档并重新生成
campaign.help.save=campaign-save               - 立即保存当前区块
campaign.help.stop=campaign-stop               - 停止托管
campaign.help.status=campaign-status             - 显示战役状态
campaign.help.sectors=campaign-sectors [page]    - 列出区块预设及其状态
campaign.help.capture=campaign-capture            - 强制判定当前区块通关
campaign.help.research=campaign-research <name>  - 解锁一项科技
campaign.help.researchall=campaign-research-all     - 解锁全部科技
campaign.help.relock=campaign-relock <name>    - 重新锁上某项科技
campaign.help.config=campaign-config             - 显示插件配置
campaign.help.reload=campaign-reload             - 重新读取 config.json
campaign.help.vote=campaign-vote [info|cancel] - 查看或取消正在进行的玩家投票
campaign.help.sectorarg=区块可用预设名（groundZero）、区块 ID（170）、id:170 或 星球:名称（erekir:onset）指定。

