# Campaign Server Side - English messages (fallback bundle)
# Every in-game / console / API text lives here; keep keys in sync with bundle_zh_CN.properties.

# ---------------------------------------------------------------- command list
campaign.help.header=Campaign commands:
campaign.help.host=campaign-host [sector]      - host the campaign, starting at a sector
campaign.help.goto=campaign-goto <sector>      - switch to another sector (saves the current one)
campaign.help.reset=campaign-reset <sector>     - delete the sector save and generate it again
campaign.help.save=campaign-save               - save the current sector now
campaign.help.stop=campaign-stop               - stop hosting
campaign.help.status=campaign-status             - show the campaign status
campaign.help.sectors=campaign-sectors [page]    - list sector presets and their status
campaign.help.capture=campaign-capture            - force-capture the current sector
campaign.help.research=campaign-research <name>  - unlock a research entry
campaign.help.researchall=campaign-research-all     - unlock every research entry
campaign.help.relock=campaign-relock <name>    - lock a research entry again
campaign.help.config=campaign-config             - show the plugin configuration
campaign.help.reload=campaign-reload             - reload config.json
campaign.help.vote=campaign-vote [info|cancel] - show or cancel the running player vote
campaign.help.sectorarg=A sector can be given by preset name (groundZero), id (170), id:170 or planet:name (erekir:onset).

